name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BlinkScroll.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlinkScroll-apk
          path: BlinkScroll.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failures = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              failures += int(r.get("failures", 0)) + int(r.get("errors", 0))
          line = f"Unit tests: {total} run, {failures} failed"
          print(line)
          open("test-summary.txt", "w").write(line + "\n")
          EOF

      # Latest APK as a GitHub release (easy to download from the phone)
      # and on the "apk" branch (single commit, overwritten on each build).
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BlinkScroll.apk \
            --title "Blink Scroll — dernière version" \
            --notes "Build automatique du commit ${GITHUB_SHA::7}. Télécharge BlinkScroll.apk ci-dessous et ouvre-le sur ton téléphone." \
            --latest
          mkdir /tmp/apk && cp BlinkScroll.apk test-summary.txt /tmp/apk/ && cd /tmp/apk
          git init -q -b apk
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
