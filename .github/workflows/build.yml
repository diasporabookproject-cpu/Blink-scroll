name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build-log.txt

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failures = 0
          lines = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              failures += int(r.get("failures", 0)) + int(r.get("errors", 0))
              for case in r.iter("testcase"):
                  for fail in list(case.iter("failure")) + list(case.iter("error")):
                      lines.append(f"FAIL {case.get('classname')}.{case.get('name')}: {(fail.get('message') or '')[:300]}")
              out = r.find("system-out")
              if out is not None and out.text and out.text.strip():
                  lines.append(f"--- stdout {r.get('name')}:\n{out.text.strip()[:3000]}")
          summary = f"Unit tests: {total} run, {failures} failed\n" + "\n".join(lines)
          print(summary)
          open("test-summary.txt", "w").write(summary + "\n")
          EOF

      # Results on the "ci-results" branch, readable even when the build fails.
      - name: Publish CI results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/results
          cp test-summary.txt /tmp/results/ 2>/dev/null || true
          tail -n 400 build-log.txt > /tmp/results/build-log.txt 2>/dev/null || true
          echo "${GITHUB_SHA::7} ${{ job.status }}" > /tmp/results/commit.txt
          cd /tmp/results
          git init -q -b ci-results
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "CI ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BlinkScroll.apk

      # Latest APK as a GitHub release (easy to download from the phone)
      # and on the "apk" branch (single commit, overwritten on each build).
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BlinkScroll.apk \
            --title "Blink Scroll — dernière version" \
            --notes "Build automatique du commit ${GITHUB_SHA::7}. Télécharge BlinkScroll.apk ci-dessous et ouvre-le sur ton téléphone." \
            --latest
          mkdir /tmp/apk && cp BlinkScroll.apk test-summary.txt /tmp/apk/ && cd /tmp/apk
          git init -q -b apk
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
